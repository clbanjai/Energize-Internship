name: Update Database Notes Fields

on:
  workflow_dispatch:
  schedule:
  - cron: '0 8 * * 1'  # Runs every Monday at 08:00 UTC


jobs:
  funding-pipeline:
    runs-on: ubuntu-latest
    
    env:
      SUPABASE_API_URL: ${{ secrets.SUPABASE_API_URL }}
      SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
      AFFINITY_API_KEY: ${{ secrets.AFFINITY_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run update_scrypt
        run: |
          python update_notes.py
