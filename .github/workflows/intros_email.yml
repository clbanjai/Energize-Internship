name: Intros Email Processing Affinity Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * 1-5'  # Runs Mon-Fri at 4 PM America/Chicago (21:00 UTC)

jobs:
  funding-pipeline:
    runs-on: ubuntu-latest
    
    env:
      SUPABASE_API_URL: ${{ secrets.SUPABASE_API_URL }}
      SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
      AFFINITY_API_KEY: ${{ secrets.AFFINITY_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Git sync before pipeline
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase

      - name: Run intros_scrypt
        run: |
          python intros.py

      - name: Commit and push updated newsletter tracker files
        run: |
          # Stage changes
          git add private_data/*.json

          # Check if there’s anything to commit
          if git diff --cached --quiet; then
            echo "✅ No newsletter tracker changes detected. Skipping commit."
          else
            git commit -m "chore: update newsletter trackers with new funding deals [skip ci]"
            git push origin main
          fi