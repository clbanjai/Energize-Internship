name: Enrich Chunk 5

on:
  workflow_dispatch:

jobs:
  enrich-chunk-5:
    runs-on: ubuntu-latest
    env:
      AFFINITY_API_KEY: ${ secrets.AFFINITY_API_KEY }

    steps:
      - name: Checkout repository 
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run enrichment for chunk 5
        run: python action.py 5

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
           name: enriched-output
           path: enriched_list_chunk_5.csv
